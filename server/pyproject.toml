[project]
name = "jarvis-upload-server"
version = "0.1.0"
description = "Upload server for the Pixel volume-key voice recorder"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    # Voice AI assistant (Gemini Live bridge)
    "google-genai>=2.33",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "psutil>=7.2.2",
]

[tool.uv]
package = false
